<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* خلفية متدرجة عشان تبرز الشفافية الثلجية */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            overflow: hidden;
        }
        /* دوائر إضاءة في الخلفية لزيادة التأثير الزجاجي */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            z-index: 0;
        }
        body::before {
            background: linear-gradient(#00d2ff, #3a7bd5);
            top: 10%;
            left: 15%;
        }
        body::after {
            background: linear-gradient(#ff007f, #ff758c);
            bottom: 10%;
            right: 15%;
        }
        .calculator {
            position: relative;
            z-index: 1;
            width: 330px;
            padding: 25px;
            border-radius: 25px;
            /* سر التصميم الثلجي الشفاف */
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.25);
        }
        .display {
            width: 100%;
            height: 85px;
            background: rgba(0, 0, 0, 0.2);
            border: none;
            border-radius: 15px;
            margin-bottom: 20px;
            padding: 15px;
            text-align: right;
            font-size: 2.2rem;
            color: #ffffff;
            outline: none;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.15);
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            height: 60px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.3rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
        }
        button:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.3);
        }
        .operator {
            background: rgba(0, 210, 255, 0.25);
            color: #8be9fd;
            font-weight: bold;
        }
        .clear {
            background: rgba(255, 75, 92, 0.3);
            color: #ff9aa2;
        }
        .equal {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.6), rgba(58, 123, 213, 0.6));
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" class="display" id="display" readonly placeholder="0">
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('/')">÷</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">-</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendValue(val) {
        display.value += val;
    }

    function clearDisplay() {
        display.value = '';
    }

    function deleteLast() {
        display.value = display.value.slice(0, -1);
    }

    function calculate() {
        try {
            if (display.value === '') return;
            // استبدال الرموز وحساب الناتج بأمان
            let result = Function('"use strict";return (' + display.value + ')')();
            display.value = Number.isInteger(result) ? result : result.toFixed(4);
        } catch (e) {
            display.value = 'خطأ';
            setTimeout(clearDisplay, 1200);
        }
    }
</script>

</body>
</html>
